[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contrailstereo"
version = "0.1.0"
description = "Stereoscopic contrail height estimation and tracking"
requires-python = ">=3.11"
dependencies = []        

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]